# VAHANM — Detection Configuration
# Used by YOLODetector (yolo_detector.py)
# edge_tracker.py uses its own defaults directly.

# ── Model ────────────────────────────────────────────────────────────────────
# For new work use YOLO26. yolov26 names (yolov26n.pt, yolov26s.pt …) are still
# supported by Ultralytics for backwards compatibility.
model_path: "yolo26n.pt"    # yolo26n / yolo26s / yolo26m / yolo26l / yolo26x
model_size: "n"             # used only if model_path is not an explicit filename

# ── Detection thresholds ──────────────────────────────────────────────────────
conf_threshold: 0.35        # minimum detection confidence (edge_tracker default: 0.35)
iou_threshold:  0.45        # NMS IoU threshold

# ── Device ───────────────────────────────────────────────────────────────────
device: "cpu"               # "cuda" | "cpu" | "mps" (Apple Silicon)
                            # YOLO auto-selects CUDA when available;
                            # set explicitly here only to override.

# ── Half precision ───────────────────────────────────────────────────────────
# FP16 inference is faster but requires an NVIDIA GPU with CUDA.
# Enabling it on CPU raises an error or silently falls back.
# Leave false unless you have confirmed CUDA is available.
half_precision: false

# ── Image size ───────────────────────────────────────────────────────────────
imgsz: 640                  # 320 / 416 / 640 / 1280
                            # smaller → faster, lower accuracy
                            # larger  → slower, higher accuracy

# ── Class filter ─────────────────────────────────────────────────────────────
# null   = detect all COCO classes
# [2, 3, 5, 7] = cars, motorcycles, buses, trucks only
classes: null

# ── Preprocessing (YOLODetector wrapper only) ────────────────────────────────
preprocess:
  resize: true
  target_size: 640
  normalize: true
  color_conversion: true    # BGR → RGB
